<!DOCTYPE html>
<html lang="en">
<head>
    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
     <!-- STYLES -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    <!-- ================================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================================= -->
    <main id="content">
        <!-- PROJECTS LIST -->
        <div class="page" id="projects-page" style="display: flex;">

            <header>
                <h2>Projects</h2>
                <!-- Para dar estilo a los botones de exportación/importación y de "Nuevo proyecto" -->
                <div style="display: flex; align-items: center; column-gap: 15px;">
                    <!-- Creo un ID para que al clicar en el botón de subida de archivos se pueda importar un JSON con una lista de proyectos -->
                    <span id="import-projects-btn" class="material-icons-round action-icon">file_upload</span>
                    <!-- Creo un ID para que al clicar en el botón de descarga se pueda descargar la lista de los proyectos -->
                    <span id="export-projects-btn" class="material-icons-round action-icon">file_download</span>
                    <!-- Creo un ID para el botón de creación de nuevo proyecto para poder referenciarlo en Javascript -->
                    <button id="new-project-btn"><span class="material-icons-round">add</span>New Project</button>
                </div>
            </header>

            <!-- Creo un ID para el contenedor de la lista de proyectos para luego referenciarlo en Javascript y poder insertar dinámicamente nuevos proyectos -->
            <!-- Los proyectos insertados ya en el HTML son "hardcodeados", es decir, son solo mockups iniciales -->
            <!-- Por este motivo, se borran todas las tarjetas de proyecto, para que se creen directamente desde el formulario -->
            <div id="projects-list"></div>
        </div>

        <!-- Generamos un id para referenciar el elemento dialog -->
        <dialog id="new-project-modal">
            <!-- Generamos un id para referenciar el formulario -->
            <form id="new-project-form">
                <h2>New Project</h2>
                <div class="input-list">
                    <div class="form-field-container">
                        <label><span class="material-icons-round">apartment</span>Name</label>
                        <input name="name" type="text" placeholder="What's the name of your project?">
                        <p style="color: gray; font-size: var(--font-sm); margin-top: 5px; font-style: italic;">TIP: Give it a short name</p>
                    </div>
                    <div class="form-field-container">
                        <label><span class="material-icons-round">subject</span>Description</label>
                        <textarea name="description" cols="30" rows="5" placeholder="Give your project a nice description! So people is jealous about it."></textarea>
                    </div>
                    <div class="form-field-container">
                        <label><span class="material-icons-round">person</span>Role</label>
                        <select name="userRole">
                        <option>Architect</option>
                        <option>Engineer</option>
                        <option>Developer</option>
                        </select>
                    </div>
                    <div class="form-field-container">
                        <label><span class="material-icons-round">not_listed_location</span>Status</label>
                        <select name="status">
                        <option>Pending</option>
                        <option>Active</option>
                        <option>Finished</option>
                        </select>
                    </div>
                    <div class="form-field-container">
                        <label>
                            <span class="material-icons-round">payments</span>
                            Cost
                        </label>
                        <input name="cost" type="number" min="0" placeholder="Project cost">
                    </div>
                    <div class="form-field-container">
                        <label for="finishDate">
                        <span class="material-icons-round">calendar_month</span>
                        Finish Date
                        </label>
                        <input name="finishDate" type="date"></input>
                    </div>
                    <div style="display: flex; margin: 10px 0px 10px auto; column-gap: 10px;">
                        <!-- El tipo de botón de Cancel es "button" y el tipo de botón Accept es "submit" -->
                        <!-- Añadimos un ID al botón Cancel para poder referenciarlo en Javascript -->
                        <button id="cancel-project-btn" type="button" style="background-color: transparent;">Cancel</button>
                        <button type="submit" style="background-color: rgb(18, 145, 18);">Accept</button>
                    </div>
                </div>
            </form>
        </dialog>

        <!-- Se genera un nuevo modal para introducir los ToDo items -->
        <dialog id="new-todo-modal">
            <form id="new-todo-form">
                <h2>New To-Do</h2>
                <div class="input-list">
                    <div class="form-field-container">
                        <label>
                        <span class="material-icons-round">task</span>
                        Description
                        </label>
                        <input name="todoText" type="text" placeholder="Write your task..." />
                        <!-- Añadir el estado del To-Do -->
                        <div class="form-field-container">
                            <label>
                                <span class="material-icons-round">flag</span>
                                Status
                            </label>
                            <select name="todoStatus">
                                <option>Pending</option>
                                <option>In Progress</option>
                                <option>Completed</option>
                            </select>
                        </div>
                    </div>

                    <div style="display:flex; margin:10px 0px 10px auto; column-gap:10px;">
                        <button id="cancel-todo-btn" type="button" style="background-color: transparent;">Cancel</button>
                        <button type="submit" style="background-color: rgb(18,145,18);">Accept</button>
                    </div>
                </div>
            </form>
        </dialog>

        <!-- PROJECT DETAILS -->
        <div class="page" id="project-details" style="display: none">
            <header>
                <div>
                    <h2 data-project-info="name">Hospital Center</h2>
                    <p data-project-info="description" style="color: #969696">Community hospital located at downtown</p>
                </div>
            </header>
            <div class="main-page-content">
                <div style="display: flex; flex-direction: column; row-gap: 30px;">
                    <!-- TARJETA DE PROYECTO: DETALLES DE PROYECTO -->
                    <div class="dashboard-card" style="padding: 30px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0px 30px; margin-bottom: 30px;">
                            <p class="project-details-icon">HC</p>
                            <button id="edit-project-btn" class="btn-secondary">Edit</button>
                        </div>
                        <div style="padding: 0 30px;">
                            <div>
                                <h5 data-project-info="name">Hospital Center</h5>
                                <p data-project-info="description">Community hospital located at downtown</p>
                            </div>
                            <div style="display: flex; column-gap: 30px; padding: 30px 0px; justify-content: space-between;">
                                <div>
                                <p style="color: #969696; font-size: var(--font-sm)">Status</p>
                                <p data-project-info="status">Active</p>
                                </div>
                                <div>
                                <p style="color: #969696; font-size: var(--font-sm)">Cost</p>
                                <p data-project-info="cost">0</p>
                                </div>
                                <div>
                                <p style="color: #969696; font-size: var(--font-sm)">Role</p>
                                <p data-project-info="userRole">Engineer</p>
                                </div>
                                <div>
                                <p style="color: #969696; font-size: var(--font-sm)">Finish Date</p>
                                <p data-project-info="finishDate">2023-05-01</p>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; column-gap:15px;">
                                <input id="progress-input" type="number" min="0" max="100" placeholder="%" style= "margin-bottom: 10px; width:80px;"/>
                                <div class="progress-container">
                                    <div id="progress-bar" class="progress-bar"></div>
                                    <div id="progress-label" class="progress-label"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- TARJETA DE PROYECTO: TO-DO -->
                    <div class="dashboard-card" style="flex-grow: 1;">
                        <div style="padding: 20px 30px; display: flex; align-items: center; justify-content: space-between;">
                            <h4>To-Do</h4>
                            <div style="display: flex; align-items: center; justify-content: end; column-gap: 20px;">
                                <div style="display: flex; align-items: center; column-gap: 10px;">
                                <span class="material-icons-round">search</span>
                                <input type="text" placeholder="Search To-Do's by name" style="width: 100%;">
                                </div>
                                <span id="add-todo-btn" class="material-icons-round action-icon">add</span>
                            </div>
                        </div>
                        <div id="todo-list" style="display: flex; flex-direction: column; padding: 10px 30px; row-gap: 20px;"></div>
                    </div>
                </div>
                <div id="viewer-container" class="dashboard-card" style="min-width: 0;"></div>
            </div>
        </div>
    </main>
    
    <!-- Para vincular el archivo index.js con el archivo html es necesario incluir esto: -->
    <!-- Cambio la ruta para que busque dentro de la nueva carpeta src donde se encuentra el archivo index.js -->
    <!-- Añado type="module" para indicar el uso de archivos separados (módulos) -->
    
    <!-- SCRIPTS -->
    <script type="module" src="./src/index.tsx"></script>

<!-- Cuadro de error si creas un proyecto que ya existe -->
<dialog id="error-modal" class="error-modal">
  <h3>Error</h3>
  <p id="error-message"></p>
  <button id="error-ok-btn">OK</button>
</dialog>

</body>
</html>
